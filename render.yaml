services:
  - type: web
    name: sims-backend
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm run start --workspace backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://aa3d9d4b.sims-saas.pages.dev
      - key: APP_NAME
        value: SIMS
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
