version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: sims-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sims_db
      MYSQL_USER: sims
      MYSQL_PASSWORD: sims
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: sims-backend
    depends_on:
      - mysql
    environment:
      PORT: 4000
      JWT_SECRET: change-this-secret-in-production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: sims
      DB_PASSWORD: sims
      DB_NAME: sims_db
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
    container_name: sims-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api/v1
    ports:
      - '5173:5173'

volumes:
  mysql_data:
